name: demo-api CI/CD

on:
  push:
    branches:
      - demo-api
    paths:
      - "demo-api/**" #test
      - "k8s/demo-api/**"
      - ".github/workflows/demo-api-ci.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ghcr.io/huhlik-cz/demo-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: demo-api
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: demo-api
        run: |
          echo "CWD: $(pwd)"
          python -c "import sys, os; print('sys.path:', sys.path)"
          export PYTHONPATH=$(pwd)
          pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: vars
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./demo-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update image tag in deployment manifest
        run: |
          TAG=${{ steps.vars.outputs.tag }}
          FILE="k8s/demo-api/deployment.yaml"
          echo "Updating image tag in $FILE to ${TAG}"
          sed -i "s|\(ghcr.io/huhlik-cz/demo-api:\).*|\1${TAG}|" "$FILE"
          grep "ghcr.io/huhlik-cz/demo-api" "$FILE"

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/demo-api'
        run: |
          set -e
          TAG=${{ steps.vars.outputs.tag }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/demo-api/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
            exit 0
          fi
          git pull --rebase origin main || true
          git commit -m "Deploy demo-api image ${TAG}"
          git push origin main
