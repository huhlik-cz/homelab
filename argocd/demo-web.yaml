apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/huhlik-cz/homelab.git
    targetRevision: main
    path: k8s/demo-web
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-web
  syncPolicy:
    automated:
      prune: true      # smaže neexistující objekty
      selfHeal: true   # obnoví chybějící objekty
