apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/huhlik-cz/homelab.git
    targetRevision: demo-api          # ← VĚTEV!
    path: k8s/demo-api
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-api               # stejné jako v namespace.yaml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
